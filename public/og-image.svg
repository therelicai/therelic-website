<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0c93e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c93e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000"/>

  <!-- Subtle blue radial at top -->
  <rect width="1200" height="630" fill="url(#blueGlow)"/>

  <!-- Bottom hairline -->
  <line x1="0" y1="629" x2="1200" y2="629" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Logo (scaled and centered horizontally, upper third) -->
  <g transform="translate(560, 110) scale(1.1)">
    <path d="M 4 4 L 58 4 L 76 22 L 76 76 L 22 76 L 4 58 Z"
          stroke="white" stroke-width="6" fill="none" stroke-linejoin="miter"/>
    <ellipse cx="40" cy="40" rx="22" ry="9"
             stroke="white" stroke-width="4" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="265"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="28" font-weight="500"
        fill="rgba(255,255,255,0.55)"
        letter-spacing="0.22em"
        text-anchor="middle">THE RELIC</text>

  <!-- Headline -->
  <text x="600" y="380"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="72" font-weight="600"
        fill="white"
        letter-spacing="-0.025em"
        text-anchor="middle">See every agent.</text>
  <text x="600" y="466"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="72" font-weight="600"
        fill="white"
        letter-spacing="-0.025em"
        text-anchor="middle">Govern every decision.</text>

  <!-- Subtitle -->
  <text x="600" y="548"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
        font-size="24" font-weight="400"
        fill="rgba(255,255,255,0.5)"
        text-anchor="middle">The authorization layer for the agent era.</text>
</svg>
